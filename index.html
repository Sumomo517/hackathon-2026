<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>saudade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Zen+Old+Mincho:wght@400;600&family=Space+Mono&display=swap">
<style>
  [hidden]{display:none!important}
  :root{
    color-scheme: dark;
    --night:#0C0E14;
    --deep:#161A24;
    --ember:#FFD9A6;
    --rose:#E8A3A3;
    --paper:#F2EEE8;
    --dim:#9AA0B4;
    --line:rgba(242,238,232,.16);
    --serif-pt:"Cormorant Garamond","Times New Roman",serif;
    --serif-ja:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --mono:"Space Mono",ui-monospace,Menlo,monospace;
  }
  html,body{height:100%;margin:0}
  body{background:var(--night);color:var(--paper);font-family:var(--serif-ja);overflow:hidden;-webkit-font-smoothing:antialiased}
  body{background:linear-gradient(180deg,#15141B 0%,#221D22 75%,#100E12 100%)}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:grayscale(.75) sepia(.38) brightness(.5) contrast(1.05);opacity:0;pointer-events:none;z-index:0}
  body.cam video{opacity:1}
  #holo{position:fixed;inset:0;width:100%;height:100%;display:block;mix-blend-mode:screen;pointer-events:none;z-index:1}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:transparent;z-index:2}
  #film{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 50%,rgba(12,10,14,0) 45%,rgba(12,10,14,.62) 100%)}
  #film::after{content:"";position:absolute;inset:-100px;background-image:var(--grain);opacity:.07;mix-blend-mode:overlay;animation:grain .5s steps(4) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-40px,30px)}50%{transform:translate(30px,-50px)}75%{transform:translate(-20px,-20px)}100%{transform:translate(0,0)}}
  @media (prefers-reduced-motion:reduce){#film::after{animation:none}}

  .hud{z-index:5;position:fixed;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top,0px)) 20px max(16px,env(safe-area-inset-bottom,0px));display:grid;grid-template-rows:auto auto 1fr;gap:12px;text-shadow:0 1px 10px rgba(12,14,20,.8)}
  .hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand b{font-family:var(--serif-pt);font-style:italic;font-weight:500;font-size:30px;line-height:1}
  .brand span{font-size:12px;color:var(--dim);letter-spacing:.2em}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border:1px solid var(--line);border-radius:2px;color:var(--dim);background:rgba(12,14,20,.55);text-shadow:none;font-variant-numeric:tabular-nums}
  .chip.on{color:var(--paper);border-color:rgba(255,217,166,.55)}
  .chip.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ember);margin-right:6px;vertical-align:1px}
  button.chip{cursor:pointer}
  button.chip:hover{color:var(--paper)}
  button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

  .center{align-self:start;justify-self:center;text-align:center;display:flex;flex-direction:column;gap:6px;max-width:min(680px,100%)}
  .state{font-size:14px;letter-spacing:.12em}
  .state em{font-family:var(--serif-pt);font-style:italic;font-size:19px;letter-spacing:.02em;margin-right:8px;color:var(--ember)}
  .hint{font-size:12px;color:var(--dim);min-height:1.4em}
  .mouse-btns{pointer-events:auto;justify-self:center;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .wave-btn{pointer-events:auto;justify-self:center;background:transparent;border:1px solid rgba(255,217,166,.55);color:var(--ember);font-family:var(--serif-ja);font-size:14px;padding:9px 18px;border-radius:2px;cursor:pointer}

  .toast{z-index:8;position:fixed;left:50%;top:76px;transform:translateX(-50%);background:rgba(22,26,36,.95);border:1px solid var(--line);padding:9px 14px;font-size:13px;max-width:calc(100% - 32px);border-radius:2px;transition:opacity .6s}

  .slides{position:fixed;inset:0;z-index:9;background:#0b0a0c;cursor:none}
  .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:slidein .6s ease both}
  .slide.dark{background:#0b0a0c}
  .slide.light{background:#fff}
  .slide img{width:100%;height:100%;object-fit:contain;display:block}
  .keys{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));margin:0;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em}
  .slide.dark .keys{color:rgba(242,238,232,.45)}
  .slide.light .keys{color:rgba(20,20,20,.38)}
  @keyframes slidein{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.slide{animation:none}}
  .intro{z-index:9;position:fixed;inset:0;display:flex;align-items:flex-start;padding:24px max(16px,6vw);background:linear-gradient(90deg,rgba(12,14,20,.95) 0%,rgba(12,14,20,.8) 46%,rgba(12,14,20,.1) 100%);overflow-y:auto}
  .intro-inner{max-width:620px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
  .intro h1{margin:0;font-family:var(--serif-pt);font-style:italic;font-weight:400;font-size:clamp(44px,6.4vw,88px);line-height:.95;white-space:nowrap}
  @media (max-height:860px){ .how dd span{display:none} .def{line-height:1.7} .intro-inner{gap:12px} }
  @media (max-width:560px){ .intro h1{white-space:normal} }
  .sub{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em;display:flex;gap:14px;flex-wrap:wrap}
  .def{font-size:clamp(16px,2vw,19px);line-height:1.9;margin:0;text-wrap:balance}
  .def small{display:block;font-family:var(--serif-pt);font-style:italic;font-size:17px;color:var(--dim);margin-top:4px;line-height:1.4}
  .how{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:14px;line-height:1.5}
  .how dt{font-family:var(--serif-pt);font-style:italic;font-size:18px;color:var(--ember);line-height:1.3}
  .how dd{margin:0}
  .how dd span{color:var(--dim);font-size:12px;display:block}
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .framing{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
  .framing-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;align-self:center;margin-right:4px}
  .seg{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:150px;padding:10px 14px;border-radius:2px;cursor:pointer;background:transparent;color:var(--paper);border:1px solid var(--line);font-family:var(--serif-ja);font-size:16px}
  .seg small{font-size:11px;color:var(--dim)}
  .seg[aria-pressed="true"]{border-color:var(--ember);background:rgba(255,217,166,.1);color:var(--ember)}
  .seg:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
  .btn{font-family:var(--serif-ja);font-size:15px;padding:12px 20px;border-radius:2px;cursor:pointer;border:1px solid var(--ember);background:var(--ember);color:#2a1a08}
  .btn.ghost{background:transparent;color:var(--paper);border-color:var(--line)}
  .btn:hover{filter:brightness(1.06)}
  .note{font-size:12px;color:var(--dim);line-height:1.7;margin:0}
  @media (max-width:560px){ .brand b{font-size:24px} }
  @media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<canvas id="holo" aria-hidden="true"></canvas>
<canvas id="stage" aria-label="カメラに映る人の隣に、2秒遅れで同じ動きをする光の粒の人影が立っている。手を振ると、その人影は手を振り返して消えていく"></canvas>
<video id="cam" playsinline muted></video>
<div id="film" aria-hidden="true"></div>

<div class="hud" id="hud" hidden>
  <div class="hud-top">
    <div class="brand"><b>saudade</b><span>またね、過去の私</span></div>
    <div class="chips">
      <span class="chip" id="chipCam">mouse</span>
      <span class="chip" id="chipBody">body</span>
      <span class="chip" id="chipBye">別れ 0</span>
      <span class="chip" id="chipPhoto">写真 0</span>
      <button class="chip" id="btnSound" type="button">音 off</button>
      <button class="chip" id="btnFull" type="button">全画面</button>
    </div>
  </div>
  <div style="display:grid;gap:10px;justify-items:center">
    <div class="center">
      <div class="state" id="state"><em>reencontro</em>2秒前のあなたが、となりに立つ</div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="mouse-btns" id="mouseBtns" hidden><button class="wave-btn" id="btnWave" type="button">手を振る（W）</button><button class="wave-btn" id="btnUp" type="button">ピース（P）</button></div>
  </div>
  <div></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const TAU = Math.PI * 2;
  const $ = id => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const DELAY = 2000;          // 2秒遅れ
  const RETURN_AFTER = 7000;   // 消えてから戻ってくるまで

  const cv = $('stage'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- the silhouette: what the camera actually sees ----------
  // 骨格は使わず、カメラに映っている人の形(シルエット)をそのまま粒子にする。上半身だけなら上半身だけ。
  let GW = 160, GH = 90;
  function gridSize() { GW = 160; GH = Math.max(40, Math.round(160 * H / W)); }
  gridSize();
  addEventListener('resize', () => { gridSize(); history.length = 0; liveMask = null; });
  const mcan = document.createElement('canvas'), mctx = mcan.getContext('2d', { willReadFrequently: true });

  const video = $('cam');
  let seg = null, mode = 'demo';
  const history = [];         // { t, f }  f = a frame (mask + box + hand) or null
  let liveMask = null, lastSegVT = -1, maskInvert = null, invVotes = [], lastSeen = -1e9, liveFrame = null;

  function camMap() {
    const vw = video.videoWidth, vh = video.videoHeight, sc = Math.max(W / vw, H / vh);
    const dw = vw * sc, dh = vh * sc;
    return { dx: (W - dw) / 2, dy: (H - dh) / 2, dw, dh };
  }
  // One Euro フィルタ:止まっているときは強くならし、速く動くときは遅れずについていく
  const EU = [];
  function euro(k, x, dt, minCut = 0.9, beta = 0.012) {
    const dCut = 1.2, al = c => { const tau = 1 / (2 * Math.PI * c); return 1 / (1 + tau / dt); };
    let f = EU[k];
    if (!f) { EU[k] = { x, dx: 0 }; return x; }
    f.dx = lerp(f.dx, (x - f.x) / dt, al(dCut));
    f.x = lerp(f.x, x, al(minCut + beta * Math.abs(f.dx)));
    return f.x;
  }

  // turn a mask into a frame: bounding box (smoothed) and how much of it is filled
  const framing = 'full';   // 映っている姿をそのまま使う(上半身だけでも全身でも)
  let lastBoxAt = 0, cutAt = 0;
  // 上半身:肩の段を見つけて、そこから肩幅ぶん下(腰のあたり)で切る
  function cropUpper(M, now) {
    const w = new Array(GH).fill(0);
    let top = -1, bottom = -1, maxW = 0;
    for (let y = 0; y < GH; y++) { let c = 0; for (let x = 0; x < GW; x++) if (M[y * GW + x] > 0.5) c++; w[y] = c; if (c > 1) { if (top < 0) top = y; bottom = y; } }
    if (top < 0) return;
    const h = bottom - top + 1;
    for (let y = top; y < top + h * 0.7; y++) maxW = Math.max(maxW, w[y]);
    let sy = -1; for (let y = top; y <= bottom; y++) if (w[y] >= maxW * 0.6) { sy = y; break; }
    if (sy < 0) return;
    const raw = sy + Math.max(4, w[sy] * 1.15);
    const dtc = Math.max(1 / 120, (now - (cutAt || now - 33)) / 1000); cutAt = now;
    const cut = euro(20, raw, dtc, 0.6, 0.02);
    for (let y = Math.floor(cut); y < GH; y++) { const k = clamp(1 - (y - cut) / 3); for (let x = 0; x < GW; x++) M[y * GW + x] *= k; }
  }
  function makeFrame(M0, now, hand) {
    const M = Float32Array.from(M0);
    if (framing === 'upper') cropUpper(M, now);
    let x0 = GW, y0 = GH, x1 = -1, y1 = -1, n = 0;
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (M[y * GW + x] > 0.5) { n++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (n < 30) return null;
    const dtb = Math.max(1 / 120, (now - (lastBoxAt || now - 33)) / 1000); lastBoxAt = now;
    const bx0 = euro(0, x0 - 0.5, dtb, 0.8, 0.05), by0 = euro(1, y0 - 0.5, dtb, 0.8, 0.05);
    const bx1 = euro(2, x1 + 1.5, dtb, 0.8, 0.05), by1 = euro(3, y1 + 1.5, dtb, 0.8, 0.05);
    return { mask: M, x0: bx0, y0: by0, x1: bx1, y1: by1, fill: n / Math.max(1, (x1 - x0 + 1) * (y1 - y0 + 1)), hand, inner: null };
  }
  // how deep inside the body each cell is (a blurred mask): the middle glows, the edge is the rim
  function innerOf(f) {
    if (f.inner) return f.inner;
    let a = Float32Array.from(f.mask), b = new Float32Array(a.length);
    for (let pass = 0; pass < 2; pass++) {
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { let s = 0, c = 0; for (let k = -3; k <= 3; k++) { const xx = x + k; if (xx >= 0 && xx < GW) { s += a[y * GW + xx]; c++; } } b[y * GW + x] = s / c; }
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { let s = 0, c = 0; for (let k = -3; k <= 3; k++) { const yy = y + k; if (yy >= 0 && yy < GH) { s += b[yy * GW + x]; c++; } } a[y * GW + x] = s / c; }
    }
    return (f.inner = a);

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); flash -= dt * 3.5; }

    if (started && now - lastUi > 200) {
      lastUi = now;
      $('chipBody').classList.toggle('on', !!live);
      let html;
      const s = ghost.state;
      if (s === 'forming') html = '<em>reencontro</em>2秒前のあなたが、戻ってくる';
      else if (s === 'here') html = '<em>eco</em>となりにいるのは、2秒前のあなた';
      else if (s === 'waving') html = '<em>adeus</em>あなたが手を振った。あと少しで、あの人も手を振る';
      else if (s === 'leaving') html = '<em>adeus</em>さよなら、2秒前のわたし。3枚だけ、残しておく';
      else html = ghost.byes ? '<em>ausência</em>となりには、もう誰もいない' : '<em>espera</em>カメラの前に立ってください';
      if ($('state').innerHTML !== html) $('state').innerHTML = html;
      let hint = '';
      if (mode === 'cam' && !live) hint = '体が見つかりません。カメラの前に立ってください';
      else if (s === 'here' && mode === 'cam' && wave.flips.length) hint = '手を振っています… ' + wave.flips.length + '/3';
      else if (s === 'here') hint = mode === 'cam' ? '手を振ると別れ。ピースを少しキープすると、ツーショット' : 'マウスで左右に動く。「手を振る」で別れ、「ピース」でツーショット';
      $('hint').textContent = hint;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</html>
